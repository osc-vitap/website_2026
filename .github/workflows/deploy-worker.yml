name: Deploy OSC Events Worker

on:
  push:
    branches:
      - main
    paths:
      - "osc-events-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: osc-events-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: osc-events-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      # Migrations go first so the Worker never runs against a schema
      # older than the one it was written for. `migrations apply` is a
      # no-op when everything has already been applied.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply osc-events-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
